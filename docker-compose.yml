services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: 'admin'
      MINIO_ROOT_PASSWORD: 'password'
    command: server /data --console-address ":9001"
    ports:
      - 9000
      - 9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  ragflow:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - RAGFLOW_METADATA_DATABASE_URL='sqlite+pysqlite:///:memory:'
      - RAGFLOW_CHUNK_SIZE=512
      - RAGFLOW_CHUNK_OVERLAP=64
      - RAGFLOW_CHECK_ON_STARTUP=true
      - RAGFLOW_MAX_UPLOAD_BYTES=10485760
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=bge-m3
      - OLLAMA_GENERATION_MODEL=llama3.2
      - OLLAMA_VERIFY_SSL=false
      - OLLAMA_FOLLOW_REDIRECTS=true
      - OLLAMA_REQUEST_TIMEOUT_SECONDS=120
      - OLLAMA_MAX_RETRIES=2
      - MILVUS_ENDPOINT='./data/milvus.db'
      - MILVUS_DB_NAME=default
      - MILVUS_COLLECTION=rag_chunks
      - MILVUS_SECURE=false
      - MILVUS_CONNECT_TIMEOUT_SECONDS=10
      - MILVUS_REQUEST_TIMEOUT_SECONDS=30
      - MILVUS_MAX_RETRIES=3
      - DMS_METADATA_BACKEND=sqlite
      - DMS_SQLITE_PATH=':memory:'
      - DMS_MINIO_ENDPOINT=minio:9000
      - DMS_MINIO_ACCESS_KEY=admin
      - DMS_MINIO_SECRET_KEY=password
      - DMS_MINIO_BUCKET=documents
      - DMS_MINIO_SECURE=false
    restart: unless-stopped
    ports:
      - 8000
    depends_on:
      - minio
