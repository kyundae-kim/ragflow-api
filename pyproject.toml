[project]
name = "fagflow-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "pytest>=9.0.3",
]

[tool.fastapi]
entrypoint = "ragflow.main:app"

[tool.pytest.ini_options]
testpaths = ["test_ragflow"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
