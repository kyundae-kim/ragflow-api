[project]
name = "ragflow-api"
version = "0.1.0"
description = "FastAPI transport layer for docmesh-rag-system-core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pyjwt[crypto]>=2.12.1",
    "rag-system-core>=0.4.0",
    "sqlalchemy>=2.0",
]

[tool.fastapi]
entrypoint = "ragflow.main:app"

[tool.pytest.ini_options]
testpaths = ["test_ragflow"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["wiki"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
include = ["ragflow", "test_ragflow"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.3",
    "ruff>=0.12.0",
]
