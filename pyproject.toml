[project]
name = "fagflow-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dms",
    "fastapi[standard]>=0.135.3",
    "pytest>=9.0.3",
    "rag-system-core",
]

[tool.fastapi]
entrypoint = "ragflow.main:app"

[tool.pytest.ini_options]
testpaths = ["test_ragflow"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.uv.sources]
rag-system-core = { git = "https://github.com/kyundae-kim/docmesh-rag-system-core.git", rev = "v0.3.0" }
dms = { git = "https://github.com/kyundae-kim/dms-core.git", rev = "v0.7.0" }
